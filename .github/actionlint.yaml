self-hosted-runner:
  # Aucun label personnalisé utilisé actuellement (runs-on: self-hosted,
  # suffisant avec un seul runner). Voir docs/known-issues.md pour l'incident
  # qui a motivé cette simplification - un mismatch entre le label déclaré
  # dans ci.yml et le label réellement enregistré côté GitHub bloquait le
  # dispatch du job "deploy" sans qu'aucune erreur explicite ne soit levée.
  labels: []
