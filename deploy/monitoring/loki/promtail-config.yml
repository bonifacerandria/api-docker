# deploy/monitoring/loki/promtail-config.yml
#
# Découvre automatiquement TOUS les conteneurs Docker de la VM (via le
# service discovery Docker) et envoie leurs logs à Loki, sans avoir à
# lister chaque conteneur un par un - un nouveau service ajouté au
# docker-compose.yml sera automatiquement collecté, sans y retoucher ici.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /run/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Label "container" = nom du conteneur (ex: "taskflow-api"), lisible
      # directement dans les requêtes LogQL côté Grafana.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
