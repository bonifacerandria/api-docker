# deploy/k8s/02-secret.example.yaml
#
# ⚠️ TEMPLATE UNIQUEMENT - ne JAMAIS remplir les valeurs ici et committer.
# Comme pour smtp_password (module 13), le vrai Secret se crée directement
# sur le cluster, jamais via un fichier YAML versionné :
#
#   kubectl create secret generic taskflow-secrets \
#     --namespace=taskflow \
#     --from-literal=POSTGRES_DB=taskflow \
#     --from-literal=POSTGRES_USER=taskflow_user \
#     --from-literal=POSTGRES_PASSWORD='<vrai_mot_de_passe>' \
#     --from-literal=DATABASE_URL='postgresql://taskflow_user:<vrai_mot_de_passe>@postgres:5432/taskflow'
#
# Ça reste une amélioration modeste (Secret = base64, pas chiffré au repos
# par défaut) - suffisant pour ce module, mais à noter : un vrai secret
# manager (Sealed Secrets, Vault, ou Azure Key Vault via CSI driver) sera
# la bonne étape suivante pour un cluster qui gère de vraies données de prod.

apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
type: Opaque
stringData:
  POSTGRES_DB: taskflow
  POSTGRES_USER: taskflow_user
  POSTGRES_PASSWORD: Azerty*123
  DATABASE_URL: "CHANGE_ME"
