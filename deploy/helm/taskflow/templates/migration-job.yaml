apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "taskflow.fullname" . }}-migrate
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
  annotations:
    # Hook Helm : ce Job s'exécute automatiquement avant chaque install/
    # upgrade, jamais au démarrage de chaque pod api (même raison qu'au
    # module 16 : scaler à plusieurs replicas ne doit jamais déclencher
    # plusieurs migrations concurrentes).
    #
    # "before-hook-creation" supprime automatiquement l'ancien Job avant
    # d'en recréer un frais - exactement ce que run-migration.sh faisait
    # à la main (kubectl delete puis apply) au module 16. Ici c'est natif
    # à Helm, plus besoin du script.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "-5"
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["npm", "run", "migrate:up"]
          # PAS de configMapRef ici : contrairement à l'api-deployment,
          # `npm run migrate:up` (node-pg-migrate) ne lit que DATABASE_URL,
          # jamais NODE_ENV/PORT/API_PREFIX/LOG_LEVEL. C'est important, pas
          # juste une optimisation : un hook "pre-install" s'exécute AVANT
          # que Helm ne crée les ressources normales du chart (dont cette
          # ConfigMap fait partie) - la référencer ici provoquait
          # "CreateContainerConfigError" au tout premier `helm install`,
          # puisque la ConfigMap n'existait pas encore à ce moment précis.
          envFrom:
            - secretRef:
                name: {{ include "taskflow.secretName" . }}
