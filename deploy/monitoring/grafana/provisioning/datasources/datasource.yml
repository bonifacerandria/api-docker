# deploy/monitoring/grafana/provisioning/datasources/datasource.yml
#
# Provisionne automatiquement Prometheus ET Loki comme sources de données
# au démarrage de Grafana - pas de configuration manuelle via l'UI, tout
# est reproductible et versionné (Infrastructure as Code, même pour les dashboards).

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    # "prometheus" = nom du service dans docker-compose.yml, résolu via le
    # réseau Docker interne - jamais via Nginx/Internet, comme tout le reste
    # de la stack de monitoring.
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
