{{/* Ne crée ce Secret QUE si l'utilisateur n'a pas fourni existingSecret -
     voir values.yaml pour l'explication complète des deux modes. */}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskflow.fullname" . }}-secrets
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  # "required" bloque le déploiement avec un message clair plutôt que de
  # laisser passer un mot de passe vide silencieusement.
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword est requis (--set secrets.postgresPassword=... ou utiliser secrets.existingSecret)" .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl est requis (--set secrets.databaseUrl=... ou utiliser secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
{{- end }}
