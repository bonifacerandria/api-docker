services:

  api:
    # En production (VM), c'est TOUJOURS cette image publiée par la CI qui
    # tourne, jamais un build local -> garantie que ce qui tourne est
    # exactement ce qui a passé les tests et le smoke test en CI.
    # IMAGE_TAG permet un rollback ciblé : IMAGE_TAG=sha-abc1234 docker compose ... up -d
    image: docker.io/${DOCKERHUB_USERNAME}/taskflow-api:${IMAGE_TAG:-latest}
    container_name: taskflow-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow-net

  api-test:
    build:
      context: .
      target: test
    image: taskflow-api:test
    container_name: taskflow-api-test
    env_file:
      - .env.test
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/taskflow_test
      NODE_ENV: test
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow-net
    profiles:
      - test

  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - taskflow-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: taskflow-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/rules:/etc/prometheus/rules:ro
      - taskflow-prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      # JAMAIS 0.0.0.0 - accessible uniquement depuis la VM elle-même,
      # jamais publiquement (voir docs/azure-notes.md pour l'accès via
      # tunnel SSH). Nginx ne route rien vers Prometheus, volontairement.
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - postgres-exporter
      - node-exporter
      - cadvisor
      - alertmanager
    networks:
      - taskflow-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: taskflow-alertmanager
    restart: unless-stopped
    volumes:
      - ./deploy/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/monitoring/alertmanager/secrets/smtp_password:/etc/alertmanager/secrets/smtp_password:ro
      - taskflow-alertmanager-data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      # Jamais public, comme le reste de la stack de monitoring.
      - "127.0.0.1:9093:9093"
    networks:
      - taskflow-net

  # --- Métriques de la base de données ---
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: taskflow-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taskflow-net

  # --- Métriques de la VM elle-même (CPU, RAM, disque, réseau) ---
  # Accède au système de fichiers de l'HÔTE en lecture seule, pas à celui
  # du conteneur -> c'est la VM qui est mesurée, pas le conteneur node-exporter.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: taskflow-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      # Exclut les pseudo-filesystems qui polluent les métriques disque
      # (sinon /proc, /sys etc. remontent comme de faux "disques").
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - taskflow-net

  # --- Métriques PAR CONTENEUR (CPU/RAM/réseau de chaque conteneur) ---
  # Accès étendu nécessaire (privileged, socket Docker) pour lire les
  # cgroups de tous les conteneurs -> c'est le compromis standard de cAdvisor,
  # jamais exposé publiquement comme les autres.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: taskflow-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - taskflow-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: taskflow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Personne ne doit pouvoir s'auto-créer un compte - accès réservé à
      # l'admin défini ci-dessus (cohérent avec le reste de la stack : rien
      # ici n'est censé être multi-utilisateur public).
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - taskflow-grafana-data:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Jamais 0.0.0.0, comme Prometheus - accès uniquement via tunnel SSH.
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - taskflow-net

networks:
  taskflow-net:
    driver: bridge

volumes:
  taskflow-db-data:
  taskflow-prometheus-data:
  taskflow-grafana-data:
  taskflow-alertmanager-data: