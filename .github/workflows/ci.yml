name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Annule automatiquement une exécution en cours si un nouveau push arrive
# sur la même branche - évite de gaspiller des minutes CI sur un code déjà
# obsolète (ex: plusieurs push rapides sur une PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 0 : scan léger, ne construit rien - retour rapide sur chaque PR.
  # Deux choses différentes de la vraie image : les dépendances npm
  # (package-lock.json) et les erreurs de configuration dans le
  # Dockerfile/docker-compose.yml (ex: utilisateur root, secret en clair
  # oublié...). Jamais bloquant : sert d'alerte précoce, le vrai
  # gatekeeper reste le scan d'image du job suivant.
  # ============================================================
  security-scan:
    name: Scan de sécurité (dépendances + config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      # Voir le commentaire détaillé dans le job build-production-image :
      # aquasecurity/trivy-action a été compromis le 19 mars 2026
      # (CVE-2026-33634) - on utilise le binaire officiel vérifié par
      # checksum à la place, jamais l'action tierce.
      - name: Installer Trivy (binaire vérifié par checksum, version pré-incident)
        run: |
          TRIVY_VERSION=0.69.3
          EXPECTED_SHA256=1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75

          curl -sL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          ACTUAL_SHA256=$(sha256sum trivy.tar.gz | cut -d' ' -f1)
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "❌ Checksum invalide - binaire potentiellement compromis. Attendu: $EXPECTED_SHA256, obtenu: $ACTUAL_SHA256"
            exit 1
          fi
          echo "✅ Checksum vérifié"

          tar xzf trivy.tar.gz trivy
          chmod +x trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Scanner les dépendances npm et la configuration Docker
        run: |
          trivy fs . \
            --format sarif \
            --output trivy-fs-results.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed

      - name: Publier le rapport dans l'onglet Security de GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

  # ============================================================
  # Job 1 : construit et fait tourner les tests dans l'image Docker
  # "test" - EXACTEMENT le même Dockerfile et le même conteneur que
  # celui utilisé en local et sur la VM (docker compose --profile test
  # run --rm api-test). Si un test passe ici mais pas sur la VM (ou
  # l'inverse), c'est le signe d'une vraie divergence d'environnement.
  #
  # Note sécurité : POSTGRES_PASSWORD ci-dessous n'est PAS un secret.
  # Ce PostgreSQL est un conteneur éphémère, isolé sur le runner GitHub,
  # jamais exposé à Internet, détruit à la fin du job, sans aucune vraie
  # donnée. Un mot de passe en clair n'est un risque QUE s'il protège
  # quelque chose de réel - ce qui n'est pas le cas ici. Les VRAIS
  # secrets (identifiants de registre au module 9, clés SSH...) passeront
  # systématiquement par GitHub Actions Secrets, jamais en clair ici. 
  # ============================================================
  test:
    name: Tests (image Docker "test")
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_test
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: change_me_in_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taskflow_user -d taskflow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Construire l'image du stage "test"
        run: docker build --target test -t taskflow-api:ci-test .

      - name: Lancer la suite de tests avec couverture
        # --network host : le conteneur partage le réseau du runner, donc
        # le service postgres (publié sur localhost:5432 par GitHub Actions)    
        # est joignable directement, comme sur la VM avec docker-compose.     
        run: |
          docker run --rm --network host \
            -e NODE_ENV=test \
            -e DATABASE_URL="postgres://taskflow_user:change_me_in_production@localhost:5432/taskflow_test" \
            taskflow-api:ci-test npm run test:coverage

  # ============================================================
  # Job 2 : construit la VRAIE image de production et vérifie qu'elle    
  # est réellement déployable - pas juste "que le code passe les tests".  
  # C'est ce job qui aurait attrapé le bug du Dockerfile où le dossier  
  # migrations/ n'était pas copié dans l'image finale. 
  # ============================================================
  build-production-image:
    name: Build & validation de l'image de production
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # nécessaire pour publier le rapport Trivy (SARIF)

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow_ci_check
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: change_me_in_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taskflow_user -d taskflow_ci_check"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Construire l'image de production (stage "runner")
        run: docker build --target runner -t taskflow-api:ci-runner .

      - name: Vérifier que les migrations sont présentes ET exécutables dans l'image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="postgres://taskflow_user:change_me_in_production@localhost:5432/taskflow_ci_check" \
            taskflow-api:ci-runner npm run migrate:up

      - name: Smoke test - le conteneur démarre et /health répond
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL="postgres://taskflow_user:change_me_in_production@localhost:5432/taskflow_ci_check" \
            taskflow-api:ci-runner

          sleep 3
          curl --fail http://localhost:3000/health

          docker logs smoke
          docker rm -f smoke

      # ============================================================
      # Sécurité (module 15) : scanne l'image AVANT de la publier -
      # jamais après.
      #
      # ⚠️ On n'utilise PAS l'action "aquasecurity/trivy-action" : elle a
      # été compromise le 19 mars 2026 (CVE-2026-33634, GHSA-69fq-xp46-6x23)
      # - un attaquant a force-push 76 des 77 tags de version vers du code
      # volant les secrets du workflow AVANT de lancer le vrai scan (le
      # pipeline semblait fonctionner normalement pendant le vol). Un
      # simple pin par tag (@0.28.0) n'aurait pas protégé contre ça,
      # puisque c'est le TAG lui-même qui a été redirigé.
      #
      # À la place : le binaire Trivy officiel, téléchargé directement,
      # épinglé sur la version v0.69.3 (publiée le 3 mars 2026, avant
      # l'incident, release "Immutable" + signature GitHub vérifiée), et
      # son checksum SHA256 vérifié avant toute exécution.
      # ============================================================
      - name: Installer Trivy (binaire vérifié par checksum, version pré-incident)
        run: |
          TRIVY_VERSION=0.69.3
          EXPECTED_SHA256=1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75

          curl -sL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"

          ACTUAL_SHA256=$(sha256sum trivy.tar.gz | cut -d' ' -f1)
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "❌ Checksum invalide - binaire potentiellement compromis. Attendu: $EXPECTED_SHA256, obtenu: $ACTUAL_SHA256"
            exit 1
          fi
          echo "✅ Checksum vérifié"

          tar xzf trivy.tar.gz trivy
          chmod +x trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Scanner l'image (rapport complet, non bloquant)
        run: |
          trivy image taskflow-api:ci-runner \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH,MEDIUM \
            --ignore-unfixed

      - name: Publier le rapport dans l'onglet Security de GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Bloquer la publication si une vulnérabilité CRITIQUE (avec correctif) est trouvée
        run: |
          trivy image taskflow-api:ci-runner \
            --format table \
            --severity CRITICAL \
            --exit-code 1 \
            --ignore-unfixed

      # ============================================================
      # Publication sur Docker Hub - UNIQUEMENT sur un vrai push vers
      # main (jamais sur une pull_request), pour ne jamais publier une
      # image qui n'a pas encore été mergée. On repousse l'image DÉJÀ
      # construite et validée ci-dessus (aucun rebuild) : ce qu'on
      # publie est prouvé identique à ce qui vient de passer les tests
      # de migration et le smoke test /health.
      #
      # Repo Docker Hub volontairement PUBLIC : l'image ne contient
      # aucun secret (DATABASE_URL etc. sont injectés au runtime, jamais
      # gravés dans l'image) -> pas de raison de la rendre privée, et ça
      # évite la limite du plan gratuit (1 seul repo privé autorisé): on peut crée r autant de tags que nécessaire sur un repo public, mais pas sur un repo privé gratuit.
      # ============================================================
      - name: Se connecter à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tagger et pousser l'image validée sur Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/taskflow-api"
          SHA_TAG="sha-${GITHUB_SHA:0:7}"

          # Deux tags : "latest" (pratique, mais mutable - toujours réécrit)
          # et "sha-xxxxxxx" (immuable - sert de preuve d'audit et permet
          # un rollback exact vers n'importe quel commit déjà déployé).
          docker tag taskflow-api:ci-runner "$IMAGE:$SHA_TAG"
          docker tag taskflow-api:ci-runner "$IMAGE:latest"

          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"

          echo "Image publiée : $IMAGE:$SHA_TAG et $IMAGE:latest"

  # ============================================================
  # Job 3 : déploie sur la VM Azure. Tourne SUR LA VM ELLE-MÊME (runner
  # auto-hébergé, voir deploy/github-runner/README.md) - pas de SSH
  # entrant depuis l'infrastructure GitHub, pas de clé privée à gérer
  # comme secret. Déploie le tag sha-xxxxxxx qui vient d'être publié
  # (pas "latest") : on sait EXACTEMENT quel commit tourne en prod. 
  # ============================================================
  deploy:
    name: Déployer sur la VM Azure
    needs: build-production-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Récupérer la dernière version du code de déploiement
        run: |
          cd "${{ vars.AZURE_VM_APP_PATH }}"
          git fetch origin main
          git reset --hard origin/main

      - name: Déployer le tag validé (rollback automatique si le healthcheck échoue)
        run: |
          cd "${{ vars.AZURE_VM_APP_PATH }}"
          chmod +x deploy/deploy.sh
          ./deploy/deploy.sh "sha-${GITHUB_SHA:0:7}"
