# deploy/k8s/04-migration-job.yaml
#
# Un Job, pas une étape automatique au démarrage de chaque pod api : si on
# scale l'API à 3 replicas, on ne veut surtout pas que les 3 tentent de
# migrer la base en même temps. Ce Job se lance une fois, à la demande,
# via deploy/k8s/run-migration.sh (voir docs/azure-notes.md).
#
# Nom FIXE, pas generateName : `kubectl apply` ne supporte pas
# generateName (il a besoin d'un nom stable pour suivre l'état de la
# ressource). Mais un Job est immuable une fois créé - on ne peut pas non
# plus se contenter d'un `apply` répété pour le relancer. La solution :
# run-migration.sh supprime l'ancien Job avant d'en recréer un frais à
# chaque exécution, plutôt que de mélanger `apply` et `create` selon les
# fichiers (source de confusion, gardons `apply` partout).

apiVersion: batch/v1
kind: Job
metadata:
  name: taskflow-migrate
  namespace: taskflow
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: docker.io/bonifacemada/taskflow-api:latest
          command: ["npm", "run", "migrate:up"]
          envFrom:
            - configMapRef:
                name: taskflow-config
            - secretRef:
                name: taskflow-secrets
