apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskflow.fullname" . }}-api
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "taskflow.selectorLabels.api" . | nindent 4 }}
  ports:
    - port: 80
      targetPort: {{ .Values.config.port }}
